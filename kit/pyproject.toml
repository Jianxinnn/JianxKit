[project]
name = "mykit-cli"
version = "0.1.0"
description = "MyKit 命令行：查看、安装、更新组件；维护组件库"
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.scripts]
mykit = "mykit_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mykit_cli"]
