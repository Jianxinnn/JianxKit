[project]
name = "mykit-diffusion"
version = "0.1.0"
description = "AF3 / EDM 风格坐标扩散的标准部件（来自 Protenix，Apache-2.0）"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "scipy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mykit"]
