[project]
name = "mykit-jev"
version = "0.1.0"
description = "通用 AI 处理模块：分类、提取、判断。Jev 优先，普通语言模型补充。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mykit"]
